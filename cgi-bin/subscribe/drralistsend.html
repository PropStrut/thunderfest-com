<CENTER>
<FORM NAME="ListSendForm" METHOD=POST ACTION="listsend.cgi">

  <!--
  ;
  ; These are the LISTSEND parameters.
  ;
  ; Five fields: ServerDirectory, MailServerName, Organization, Sender, From.
  ;   Sample:
  ;     d:/webfiles/cgi-bin/subscribe/  (MUST end with '/')
  ;     Company Name
  ;     mail.mydomain.com
  ;     myrealemail@mydomain.com        (Sender & From may be the same)
  ;     webmaster@companydomain.com     (May be non-existing email address)
  ;
  -->
  <INPUT TYPE="hidden" NAME="RootDir" VALUE="d:/webs/thunderfest.com/htdocs/cgi-bin/subscribe/">
  <INPUT TYPE="hidden" NAME="Organization" VALUE="Detroit River Regatta Association">
  <INPUT TYPE="hidden" NAME="Server" VALUE="">
  <INPUT TYPE="hidden" NAME="Sender" VALUE="">
  <INPUT TYPE="hidden" NAME="From" VALUE="">

  <P>
  <B>Password:</B>
  <BR><INPUT TYPE="password" NAME="userPassword" SIZE="12">

  <P>
  <B>Subject:</B>
  <BR><INPUT TYPE="text" NAME="userSubject" SIZE="50" VALUE="DRRA REGATTA REVIEW #">

  <P>
  <B>Text:</B>
<TEXTAREA TYPE="text" NAME="userText" COLS=80 ROWS="25" WRAP="OFF">
</TEXTAREA>

  <P>
  <INPUT TYPE="submit" VALUE="---------------------  SEND NOW!  ---------------------">

</FORM>
